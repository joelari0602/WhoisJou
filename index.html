<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Universo Dual · Clever Joel</title>
    <!-- FUENTES Y LIBRERÍAS GLOBALES -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- TU CSS EXTERNO -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-sober">

    <!-- ============================================
    CANVAS (Fondo de partículas - Modo Loco)
    ============================================ -->
    <canvas id="particles-canvas"></canvas>

    <!-- ============================================
    OBJETOS FLOTANTES (Guitarra, Mic, Cámara)
    ============================================ -->
    <div class="floating-objects">
        <div class="float-item" id="guitar"><i class="fas fa-guitar"></i></div>
        <div class="float-item" id="mic"><i class="fas fa-microphone-alt"></i></div>
        <div class="float-item" id="camera"><i class="fas fa-camera-retro"></i></div>
    </div>

    <!-- ============================================
    NAVEGACIÓN VERTICAL ÚNICA (PC + Móvil)
    ============================================ -->

    <!-- Botón flotante único: abre/cierra el sidebar en cualquier tamaño -->
    <button id="sidebarToggleBtn" class="sidebar-toggle-btn" aria-label="Cerrar menú" aria-expanded="true">
        <span class="toggle-box"><span class="toggle-inner"></span></span>
    </button>

    <!-- Overlay (solo se activa en móvil, con el sidebar abierto) -->
    <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

    <aside class="sidebar" id="sidebar" aria-hidden="false">
        <div class="sidebar-logo">_Joel<span>Ari_</span></div>

        <nav class="sidebar-nav">
            <ul id="sidebarNavList">
                <li><a class="active" data-page="inicio"><i class="fas fa-house"></i><span>Inicio</span></a></li>
                <li><a data-page="profesion"><i class="fas fa-briefcase"></i><span>Profesión</span></a></li>
                <li><a data-page="fotografia"><i class="fas fa-camera-retro"></i><span>Fotografía</span></a></li>
                <li><a data-page="musica"><i class="fas fa-music"></i><span>Música</span></a></li>
                <li><a data-page="proyectos"><i class="fas fa-diagram-project"></i><span>Proyectos</span></a></li>
                <li><a data-page="personal"><i class="fas fa-user"></i><span>Personal</span></a></li>
            </ul>
        </nav>

        <button class="theme-toggle" id="themeToggle">🌪️ NO</button>
    </aside>

    <!-- ============================================
    CONTENEDOR PRINCIPAL (Aquí se inyectan las páginas)
    ============================================ -->
    <main id="app"></main>

    <!-- ============================================
    FOOTER / CONTACTO (Global)
    ============================================ -->
    <footer>
        <div class="container" style="text-align:center;">
            <h3 class="footer-title">¡Holaaaa...! 🍀</h3>
            <p class="footer-subtitle">Haz clic en cualquiera de las redes para comunicarte o seguir mi trabajo:</p>
            <div class="social-footer">
                <a href="https://wa.me/?text=Hola%20Joel,%20vi%20tu%20portafolio%20web" target="_blank" rel="noopener noreferrer" class="social-btn social-whatsapp" title="Escribirme por WhatsApp">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                </a>
                <a href="https://t.me/" target="_blank" rel="noopener noreferrer" class="social-btn social-telegram" title="Contactar por Telegram">
                    <i class="fab fa-telegram-plane"></i> Telegram
                </a>
                <a href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer" class="social-btn social-tiktok" title="Sígueme en TikTok">
                    <i class="fab fa-tiktok"></i> TikTok
                </a>
                <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" class="social-btn social-facebook" title="Perfil de Facebook">
                    <i class="fab fa-facebook"></i> Facebook
                </a>
                <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" class="social-btn social-instagram" title="Sígueme en Instagram">
                    <i class="fab fa-instagram"></i> Instagram
                </a>
                <a href="https://github.com/" target="_blank" rel="noopener noreferrer" class="social-btn social-github" title="Repositorios en GitHub">
                    <i class="fab fa-github"></i> GitHub
                </a>
                <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" class="social-btn social-linkedin" title="Perfil Profesional LinkedIn">
                    <i class="fab fa-linkedin"></i> LinkedIn
                </a>
            </div>
            <p style="color: var(--text-secondary); margin-top: 2rem; font-size: 0.9rem;">
                Hecho con ❤️ y <i class="fas fa-code"></i> por Clever Joel.
            </p>
        </div>
    </footer>

    <!-- ============================================
    SCRIPTS
    ============================================ -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <!-- TU JS EXTERNO -->
    <script src="js/main.js"></script>
</body>
</html>
